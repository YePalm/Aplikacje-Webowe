<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Cwiczenie 3</title>
    <style>
        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .box {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }

        .bg-red {
            background-color: #e63946;
        }

        .bg-blue {
            background-color: #457b9d;
        }

        .bg-green {
            background-color: #2a9d8f;
        }

        .bg-purple {
            background-color: #9c89b8;
        }
    </style>
</head>

<body>
    <h1>Kolorowe kwadraty</h1>

    <div class="row">
        <div class="box bg-red"></div>
        <div class="box bg-blue"></div>
    </div>

    <div class="row">
        <div class="box bg-green"></div>
        <img src="zdj2.jpg" alt="Obrazek 100x100" class="box">
        <div class="box bg-purple"></div>
    </div>

    <p><a href="index.html">Powrot do strony glownej</a></p>
</body>

</html>
